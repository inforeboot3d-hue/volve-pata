<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volvé Pata 🐾</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
.top{background:#111;color:#fff;padding:12px;text-align:center}
.top img{width:145px;max-width:48vw;height:58px;object-fit:contain}
.card{width:min(92%,520px);margin:24px auto;background:#fff;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.code{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;margin-bottom:15px}
h1{margin:5px 0 4px;font-size:34px}.species{color:#666;margin:0 0 18px;text-transform:capitalize}
.pet-photo{width:100%;max-height:300px;object-fit:cover;border-radius:16px;margin:5px 0 18px}
.lost{background:#e53935;color:#fff;padding:13px;border-radius:12px;font-weight:800;margin:12px 0 18px}
.safe{background:#e8f5e9;color:#1b5e20;padding:13px;border-radius:12px;font-weight:700;margin:12px 0 18px}
.description{background:#f7f7f7;border-radius:12px;padding:14px;text-align:left;line-height:1.5;margin-bottom:18px}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;background:#e53935;color:#fff;margin-top:8px}
button.dark{background:#111}.small{color:#777;font-size:13px;margin-top:18px}.error{color:#b71c1c;font-weight:700}.loading{color:#555}
.finder-logo{width:125px;height:125px;object-fit:contain;display:block;margin:0 auto 10px}
.finder-title{font-size:27px;margin:4px 0 8px}.finder-sub{color:#555;line-height:1.45;margin-bottom:20px}
.info-box{background:#f7f7f7;border-radius:14px;padding:15px;text-align:left;margin:14px 0;line-height:1.45}
.back{background:#111}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Volvé Pata"></div>
<main class="card" id="app"><div class="loading">Buscando la información de la mascota...</div></main>
<script>
const SUPABASE_URL="https://lvglcgdkbcchtuwtoxca.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_2LOTYSuSSD6tm7lT-ozUNw_o-Yw75go";
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
let mascotaActual=null;
async function cargar(){
 const app=document.getElementById("app"), codigo=new URLSearchParams(location.search).get("codigo");
 if(!codigo){app.innerHTML="<h1>Volvé Pata 🐾</h1><p class='error'>No se encontró el código de la chapita.</p><p class='small'>Escaneá nuevamente el código QR.</p>";return}
 const {data,error}=await db.from("tags").select("code, pet:pets(name,species,photo_url,description,is_lost)").eq("code",codigo).eq("active",true).maybeSingle();
 if(error){console.error(error);app.innerHTML="<h1>Volvé Pata 🐾</h1><p class='error'>No pudimos consultar la información.</p><p class='small'>Intentá nuevamente en unos segundos.</p>";return}
 if(!data||!data.pet){app.innerHTML="<h1>Volvé Pata 🐾</h1><p class='error'>Esta chapita no está activa o no está vinculada a una mascota.</p><p class='small'>Código: "+esc(codigo)+"</p>";return}
 mascotaActual=data.pet;
 const p=data.pet,n=esc(p.name),s=esc(p.species),d=esc(p.description);
 const foto=p.photo_url?"<img class='pet-photo' src='"+esc(p.photo_url)+"' alt='Foto de "+n+"'>":"";
 app.innerHTML="<div class='code'>Código "+esc(data.code)+"</div><h1>"+n+"</h1><p class='species'>"+s+"</p>"+foto+
 (p.is_lost?"<div class='lost'>🚨 ESTA MASCOTA ESTÁ PERDIDA</div>":"<div class='safe'>🐾 Perfil activo de esta mascota</div>")+
 (d?"<div class='description'><strong>Información:</strong><br>"+d+"</div>":"")+ 
 (p.is_lost?"<button onclick='encontrada()'>📍 Encontré esta mascota</button>":"")+ 
 "<p class='small'>Un escaneo puede llevarlo de vuelta a casa ❤️</p>";
}
function encontrada(){
 const app=document.getElementById("app");
 app.innerHTML="<img class='finder-logo' src='logo.png' alt='Volvé Pata'>"+
 "<div class='code'>VOLVÉ PATA</div>"+
 "<h2 class='finder-title'>¡Gracias por ayudar! 🐾</h2>"+
 "<p class='finder-sub'>Encontraste una mascota identificada con un llavero <b>Volvé Pata</b>.</p>"+
 "<div class='info-box'><b>¿Qué podés hacer ahora?</b><br><br>📍 Enviar dónde la encontraste<br>📷 Enviar una foto<br>💬 Dejar un mensaje para su dueño</div>"+
 "<button onclick='mostrarProximamente()'>📍 Continuar para ayudar</button>"+
 "<button class='back' onclick='cargar()'>← Volver a la mascota</button>"+
 "<p class='small'>Un escaneo puede llevarlo de vuelta a casa ❤️</p>";
}
function mostrarProximamente(){alert("Estamos preparando el envío de ubicación, foto y mensaje al dueño. Esta pantalla ya identifica que el llavero es de Volvé Pata.")}
cargar();
</script>
</body>
</html>
